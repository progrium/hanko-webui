const getLike=p=>operations.find(o=>o.method==='get'&&shape(o.path)===shape(p));
const pkeys=p=>[...p.matchAll(/\{([^}]+)\}/g)].map(x=>x[1]);

const shortId=v=>{v=String(v??'');return v.length>12?v.slice(0,8)+'…':v};
const singular=w=>w.replace(/ies$/,'y').replace(/s$/,'');
const shortLabel=o=>(o.summary||o.method.toUpperCase()).replace(/\b(a|an|the|new)\s+/gi,'').replace(/\s+(by id|(for|of|from|to) (a )?user)\.?$/i,'').replace(/^./,c=>c.toUpperCase());
function crumbs(){const segs=S.path.split('/').filter(Boolean),out=[];let p='';segs.slice(0,-1).forEach(seg=>{p+='/'+seg;const key=seg.match(/^\{(.+)\}$/)?.[1],label=key?shortId(S.params[key]):human(seg),target=p;if(out.length)out.push(m('span.sep','/'));out.push(getLike(target)?m('a',{title:key?S.params[key]:null,onclick:()=>go(target)},label):m('span',label))});return out.length?m('.crumbs',out):null}
function recordLabel(r){if(!r||typeof r!=='object'||Array.isArray(r))return '';return r.name||r.username||r.emails?.find?.(e=>e.is_primary)?.address||r.emails?.[0]?.address||r.address||r.slug||r.callback||''}
function heading(){const segs=S.path.split('/').filter(Boolean),last=segs[segs.length-1];if(!last)return {title:'Status'};if(!last.startsWith('{'))return {title:groups.find(g=>g[1]===S.path)?.[0]||human(last)};const kind=singular(human(segs[segs.length-2]||'record')),label=recordLabel(S.data);return label?{title:String(label),kind}:{title:kind}}
function tabs(){const base=S.path.endsWith('}')?S.path:S.path.replace(/\/[^/{}]+$/,'');if(!base.endsWith('}')||!getLike(base))return null;const b=shape(base)+'/';const kids=operations.filter(o=>{const rest=shape(o.path);return o.method==='get'&&rest.startsWith(b)&&!/[/{]/.test(rest.slice(b.length))});if(!kids.length)return null;return m('.tabs',[['Details',getLike(base).path],...kids.map(o=>[human(o.path.split('/').pop()),o.path])].map(([l,p])=>m('button',{class:shape(p)===shape(S.path)?'active':'',onclick:()=>go(p)},l)))}

  return ops.sort((a,b)=>rank[a.method]-rank[b.method]).map(o=>{const params={...S.params,...mapParams(S.path,o.path)},data=Array.isArray(S.data)?{}:S.data,run=()=>action(o,params,data);

function opsMenu(section){if(!section.length)return null;return m('details.menu',[m('summary.icon',{title:'All operations','aria-label':'All operations'},icon('more')),m('.menu-list',[m('small','All operations in this section'),...section.map(o=>m('button',{onclick:e=>{e.target.closest('details').open=false;action(o)}},[m('code.method.'+o.method,o.method.toUpperCase()),m('span',o.summary),m('code.path',o.path)]))])])}
function pageHead(queries,active,section){const h=heading(),acts=headerActions();
  return m('.page-head',[m('.page-title',[crumbs(),m('.title-row',[m('h1',h.title),h.kind?m('span.kind',h.kind):null]),m('code.subpath',S.path)]),
    m('.page-actions',[m('.icons',[filters(queries,active),m('button.icon',{title:'Refresh','aria-label':'Refresh',disabled:S.busy,class:S.busy?'spin':'',onclick:load},icon('refresh')),opsMenu(section)]),...acts])])}
const App={view(){const current=find('get',S.path),queries=parameters(current).filter(p=>p.in==='query'),active=queries.filter(p=>p.name!=='page'&&(S.params[p.name]??'')!=='').length;const section=operations.filter(o=>S.group==='/'?o.path==='/':o.path===S.group||o.path.startsWith(S.group+'/'));return [m('header',m('.header-inner',[m('.brand-row',[m('.brand','Hanko Admin'),S.me?m('.me',[m('span',S.me.email||S.me.username||S.me.user_id),m('a',{onclick:signOut},'Sign out')]):null]),m('nav.sections',{role:'tablist'},groups.map(([name,path])=>m('button',{role:'tab','aria-selected':S.group===path?'true':'false',class:S.group===path?'active':'',onclick:()=>nav(path,{},path)},name)))])),m('main',[pageHead(queries,active,section),tabs(),S.error?m('p.error',S.error):null,S.notice?m('p.notice',S.notice):null,m('.panel',[content(),queries.some(p=>p.name==='page')?m('.bar',[m('button',{disabled:S.busy||Number(S.params.page||1)<=1,onclick:()=>{S.params.page=Number(S.params.page||1)-1;load()}},'Previous'),m('small','Page '+(S.params.page||1)+(S.total!==null?' · '+S.total+' records':'')),m('button',{disabled:S.busy||(S.total!==null?Number(S.params.page||1)*Number(S.params.per_page||20)>=Number(S.total):Array.isArray(S.data)&&S.data.length<Number(S.params.per_page||20)),onclick:()=>{S.params.page=Number(S.params.page||1)+1;load()}},'Next')]):null]),m('small','Requests go through the frontend proxy. The admin API token stays on the server.')]),S.modal?m(Modal):null]}};
if(window.m){document.addEventListener('click',e=>{for(const d of document.querySelectorAll('details.filters[open],details.menu[open]'))if(!d.contains(e.target))d.open=false});m.mount(document.getElementById('app'),App);load();fetch('/admin/session').then(r=>r.ok?r.json():null).then(me=>{S.me=me;m.redraw()}).catch(()=>{})}
</script></body></html>
